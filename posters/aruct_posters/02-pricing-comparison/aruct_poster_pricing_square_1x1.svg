<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="proGlowSq" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
    <linearGradient id="topGlowSq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="#0f172a"/>
  <rect width="1200" height="360" fill="url(#topGlowSq)"/>

  <!-- logo -->
  <g transform="translate(60,50) scale(1.0)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="96" y="70" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- headline -->
  <text x="600" y="112" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">Simple, transparent pricing.</text>
  <text x="600" y="144" font-size="18" fill="#94a3b8" text-anchor="middle">Start free. Upgrade when you're ready.</text>

  <!-- PRO glow halo -->
  <rect x="437" y="197" width="336" height="891" rx="20" fill="#3b82f6" opacity="0.22" filter="url(#proGlowSq)"/>

  <!-- FREE card -->
  <g>
    <rect x="110" y="230" width="310" height="850" rx="14" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="134" y="276" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">FREE</text>
    <text x="134" y="342" font-size="48" font-weight="700" fill="#ffffff">$0</text>
    <text x="134" y="370" font-size="13" fill="#64748b">forever</text>
    <line x1="134" y1="394" x2="396" y2="394" stroke="rgba(255,255,255,0.08)"/>
    <g font-size="13" font-family="'SFMono-Regular','Menlo','Consolas',monospace" fill="#cbd5e1">
      <text x="134" y="430"><tspan fill="#3b82f6">✓</tspan>  Up to 5 scenes</text>
      <text x="134" y="468"><tspan fill="#3b82f6">✓</tspan>  JSON export</text>
      <text x="134" y="506"><tspan fill="#3b82f6">✓</tspan>  Basic 3D editor</text>
      <text x="134" y="544"><tspan fill="#3b82f6">✓</tspan>  Community support</text>
    </g>
    <rect x="134" y="1010" width="262" height="40" rx="7" fill="none" stroke="#475569" stroke-width="1.2"/>
    <text x="265" y="1035" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Get started</text>
  </g>

  <!-- PRO card -->
  <g>
    <rect x="445" y="205" width="310" height="875" rx="14" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="469" y="227" width="120" height="22" rx="11" fill="#3b82f6"/>
    <text x="529" y="242" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">MOST POPULAR</text>
    <text x="469" y="281" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="2">PRO</text>
    <text x="469" y="347" font-size="48" font-weight="700" fill="#ffffff">$29<tspan font-size="16" font-weight="500" fill="#94a3b8">/mo</tspan></text>
    <text x="469" y="375" font-size="13" fill="#64748b">14-day trial</text>
    <line x1="469" y1="399" x2="731" y2="399" stroke="rgba(255,255,255,0.08)"/>
    <g font-size="13" font-family="'SFMono-Regular','Menlo','Consolas',monospace" fill="#e2e8f0">
      <text x="469" y="435"><tspan fill="#3b82f6">✓</tspan>  Unlimited scenes</text>
      <text x="469" y="473"><tspan fill="#3b82f6">✓</tspan>  GLB + JSON export</text>
      <text x="469" y="511"><tspan fill="#3b82f6">✓</tspan>  MCP server (AI)</text>
      <text x="469" y="549"><tspan fill="#3b82f6">✓</tspan>  Priority support</text>
    </g>
    <rect x="469" y="1010" width="262" height="40" rx="7" fill="#3b82f6"/>
    <text x="600" y="1035" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Start trial</text>
  </g>

  <!-- TEAM card -->
  <g>
    <rect x="780" y="230" width="310" height="850" rx="14" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="804" y="276" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">TEAM</text>
    <text x="804" y="342" font-size="48" font-weight="700" fill="#ffffff">$79<tspan font-size="13" font-weight="500" fill="#94a3b8">/seat/mo</tspan></text>
    <text x="804" y="370" font-size="13" fill="#64748b">14-day trial</text>
    <line x1="804" y1="394" x2="1066" y2="394" stroke="rgba(255,255,255,0.08)"/>
    <g font-size="13" font-family="'SFMono-Regular','Menlo','Consolas',monospace" fill="#cbd5e1">
      <text x="804" y="430"><tspan fill="#3b82f6">✓</tspan>  Everything in Pro</text>
      <text x="804" y="462"><tspan fill="#3b82f6">✓</tspan>  IFC / BIM export</text>
      <text x="804" y="494"><tspan fill="#3b82f6">✓</tspan>  Real-time collab</text>
      <text x="804" y="526"><tspan fill="#3b82f6">✓</tspan>  SSO / SAML</text>
      <text x="804" y="558"><tspan fill="#3b82f6">✓</tspan>  Audit log</text>
    </g>
    <rect x="804" y="1010" width="262" height="40" rx="7" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <text x="935" y="1035" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Start trial</text>
  </g>

  <!-- footer -->
  <text x="600" y="1130" font-size="15" fill="#64748b" text-anchor="middle">14-day free trial · No credit card required</text>
</svg>
