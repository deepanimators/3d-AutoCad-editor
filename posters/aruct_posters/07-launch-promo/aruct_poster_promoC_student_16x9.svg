<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="warmGlowC" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>
  <rect width="1600" height="900" fill="url(#warmGlowC)"/>

  <!-- faint brand cube watermark -->
  <g transform="translate(1150,560) scale(2.2)" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.06">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>

  <!-- logo -->
  <g transform="translate(80,60) scale(1.1)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="120" y="81" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- badge -->
  <rect x="1300" y="56" width="220" height="36" rx="18" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <g transform="translate(1322,66)" stroke="#93c5fd" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 4 L8 0 L16 4 L8 8 Z"/>
    <path d="M4 6 L4 11 Q8 14 12 11 L12 6"/>
    <line x1="16" y1="4" x2="16" y2="10"/>
  </g>
  <text x="1420" y="79" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1" text-anchor="middle">STUDENT PROGRAM</text>

  <!-- headline -->
  <text x="78" y="196" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">Building your career?</text>
  <text x="78" y="254" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">We'll help you build</text>
  <text x="78" y="312" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">everything else.</text>

  <text x="80" y="350" font-size="17" fill="#94a3b8">Free for students and recent graduates.</text>
  <text x="80" y="374" font-size="17" fill="#94a3b8">Verify with your .edu email for full Pro access.</text>

  <g font-size="17" fill="#e2e8f0">
    <text x="80" y="416"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Unlimited scenes</text>
    <text x="80" y="452"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  GLB export for portfolio</text>
    <text x="80" y="488"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  MCP / AI integration</text>
    <text x="80" y="524"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Sun &amp; shadow analysis</text>
    <text x="80" y="560"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Bill of materials</text>
  </g>

  <text x="80" y="600" font-size="16" font-weight="600" fill="#22c55e">No credit card · No time limit</text>

  <rect x="80" y="628" width="360" height="54" rx="8" fill="#3b82f6"/>
  <text x="260" y="662" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Apply for free access</text>
  <text x="80" y="708" font-size="15" fill="#64748b">aruct.com/students</text>

  <!-- .edu verification card -->
  <g>
    <rect x="880" y="380" width="460" height="220" rx="14" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="912" y="424" font-size="17" font-weight="600" fill="#ffffff">Verify your student status</text>
    <rect x="912" y="450" width="396" height="52" rx="8" fill="#0c1526" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="930" y="482" font-size="15" fill="#64748b" font-family="'SFMono-Regular','Menlo','Consolas',monospace">you@university.edu</text>
    <circle cx="1276" cy="476" r="15" fill="#22c55e"/>
    <path d="M1269 476 L1274 481 L1284 469" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="912" y="536" font-size="14" fill="#94a3b8">Full Pro access. No credit card. No time limit.</text>
    <text x="912" y="568" font-size="13" fill="#64748b">Verified in seconds — no paperwork, no waiting.</text>
  </g>
</svg>
