<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="glow45" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow45" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#0f172a"/>
  <rect width="1080" height="380" fill="url(#glow45)"/>

  <!-- logo -->
  <g transform="translate(56,48) scale(1.0)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="92" y="68" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- headline -->
  <text x="70" y="212" font-size="80" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Free. <tspan fill="#3b82f6">Forever.</tspan></text>
  <text x="72" y="252" font-size="26" font-weight="600" fill="#cbd5e1">No credit card. No expiry.</text>
  <text x="72" y="288" font-size="18" fill="#94a3b8">Start designing today — the full 3D architectural</text>
  <text x="72" y="312" font-size="18" fill="#94a3b8">editor, right in your browser.</text>

  <!-- floating brand mark accent -->
  <g transform="translate(950,300) scale(1.2)" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#softGlow45)">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>

  <!-- browser mockup -->
  <g>
    <rect x="80" y="360" width="920" height="440" rx="12" fill="#0c1526" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M80 372 a12 12 0 0 1 12 -12 h896 a12 12 0 0 1 12 12 v22 h-920 z" fill="#111c33"/>
    <line x1="80" y1="394" x2="1000" y2="394" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="106" cy="381" r="5" fill="#ef4444"/>
    <circle cx="124" cy="381" r="5" fill="#f59e0b"/>
    <circle cx="142" cy="381" r="5" fill="#22c55e"/>
    <text x="540" y="386" font-size="12" fill="#64748b" text-anchor="middle">aruct.com/editor</text>

    <g stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="square">
      <line x1="220" y1="460" x2="620" y2="460"/>
      <line x1="620" y1="460" x2="860" y2="460"/>
      <line x1="860" y1="460" x2="860" y2="740"/>
      <line x1="860" y1="740" x2="220" y2="740"/>
      <line x1="220" y1="740" x2="220" y2="460"/>
      <line x1="480" y1="460" x2="480" y2="590"/>
      <line x1="480" y1="630" x2="480" y2="740"/>
      <line x1="640" y1="600" x2="740" y2="600"/>
      <line x1="780" y1="600" x2="860" y2="600"/>
    </g>
    <path d="M480 590 A40 40 0 0 1 520 630" stroke="#93c5fd" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M740 600 A40 40 0 0 1 780 600" stroke="#93c5fd" stroke-width="1.2" fill="none" opacity="0.6"/>
    <g stroke="#60a5fa" stroke-width="2.5">
      <line x1="280" y1="452" x2="280" y2="468"/>
      <line x1="330" y1="452" x2="330" y2="468"/>
      <line x1="720" y1="452" x2="720" y2="468"/>
      <line x1="770" y1="452" x2="770" y2="468"/>
    </g>
  </g>

  <!-- feature checklist -->
  <g font-size="17" fill="#e2e8f0">
    <text x="100" y="854"><tspan fill="#22c55e" font-weight="700">✓</tspan>  Up to 5 scenes</text>
    <text x="100" y="890"><tspan fill="#22c55e" font-weight="700">✓</tspan>  Basic 3D editor — walls, doors, windows, stairs</text>
    <text x="100" y="926"><tspan fill="#22c55e" font-weight="700">✓</tspan>  JSON export</text>
    <text x="100" y="962"><tspan fill="#22c55e" font-weight="700">✓</tspan>  Model catalog (Poly Haven + Poly Pizza)</text>
    <text x="100" y="998"><tspan fill="#22c55e" font-weight="700">✓</tspan>  Community support</text>
  </g>

  <!-- CTA -->
  <rect x="100" y="1060" width="340" height="54" rx="8" fill="#3b82f6"/>
  <text x="270" y="1094" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Get started free</text>
  <text x="100" y="1146" font-size="15" fill="#64748b">aruct.com · No install required. Runs in your browser.</text>
</svg>
