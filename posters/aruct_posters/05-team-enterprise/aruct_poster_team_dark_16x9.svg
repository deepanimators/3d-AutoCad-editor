<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="glow5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="edgeGlow5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>
  <rect width="1600" height="320" fill="url(#glow5)"/>

  <!-- logo -->
  <g transform="translate(80,60) scale(1.1)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="120" y="81" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- headline -->
  <text x="78" y="176" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1">Your whole firm.</text>
  <text x="78" y="238" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1">One shared scene.</text>
  <text x="80" y="272" font-size="18" fill="#94a3b8">Real-time collaboration — live cursors, presence, multi-user editing.</text>

  <!-- ROI comparison box -->
  <rect x="80" y="296" width="560" height="110" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="324" font-size="13" fill="#94a3b8" letter-spacing="0.5">TYPICAL BIM SEAT LICENSE</text>
  <text x="100" y="356" font-size="25" fill="#64748b">$3,000–$7,000/yr</text>
  <line x1="100" y1="347" x2="318" y2="347" stroke="#64748b" stroke-width="1.4"/>
  <line x1="360" y1="308" x2="360" y2="394" stroke="rgba(255,255,255,0.08)"/>
  <text x="382" y="324" font-size="13" fill="#93c5fd" letter-spacing="0.5">ARUCT TEAM</text>
  <text x="382" y="362" font-size="30" font-weight="700" fill="#3b82f6">$948<tspan font-size="14" font-weight="500" fill="#94a3b8">/yr per seat</tspan></text>
  <text x="100" y="392" font-size="14" font-weight="700" fill="#22c55e">Save 80–90% per designer</text>

  <!-- features -->
  <g font-size="17" fill="#e2e8f0">
    <text x="80" y="440"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Everything in Pro</text>
    <text x="80" y="478"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Real-time collaboration — live cursors, presence</text>
    <text x="80" y="516"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  IFC / BIM export — handoff to Revit, ArchiCAD, BIMx</text>
    <text x="80" y="554"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  SSO / SAML — connect your identity provider</text>
    <text x="80" y="592"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Audit log — track every change, every user</text>
    <text x="80" y="630"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Priority support</text>
  </g>

  <!-- price line -->
  <text x="80" y="668" font-size="16" font-weight="600" fill="#ffffff">$79/seat/month <tspan fill="#64748b" font-weight="400">·</tspan> <tspan fill="#22c55e">14-day free trial</tspan> <tspan fill="#64748b" font-weight="400">· No card required</tspan></text>

  <!-- CTA -->
  <rect x="80" y="698" width="380" height="54" rx="8" fill="#3b82f6"/>
  <text x="270" y="732" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Bring your team</text>
  <text x="80" y="778" font-size="15" fill="#64748b">aruct.com/pricing</text>

  <!-- shared-scene browser window -->
  <g>
    <rect x="780" y="280" width="680" height="480" rx="12" fill="#0c1526" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M780 292 a12 12 0 0 1 12 -12 h656 a12 12 0 0 1 12 12 v24 h-680 z" fill="#111c33"/>
    <line x1="780" y1="316" x2="1460" y2="316" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="806" cy="304" r="5" fill="#ef4444"/>
    <circle cx="824" cy="304" r="5" fill="#f59e0b"/>
    <circle cx="842" cy="304" r="5" fill="#22c55e"/>
    <text x="870" y="309" font-size="12" fill="#64748b">aruct.com/scene/lakeside-tower</text>

    <!-- presence avatars -->
    <text x="1360" y="309" font-size="11" fill="#64748b" text-anchor="end">3 online</text>
    <circle cx="1394" cy="304" r="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6"/>
    <circle cx="1412" cy="304" r="9" fill="#0f172a" stroke="#ef4444" stroke-width="1.6"/>
    <circle cx="1430" cy="304" r="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1.6"/>

    <!-- shared building model -->
    <g filter="url(#edgeGlow5)" stroke="#60a5fa" stroke-width="2.2" fill="none" stroke-linecap="round">
      <line x1="1094" y1="578" x2="1250" y2="668"/>
      <line x1="1250" y1="668" x2="1146" y2="728"/>
      <line x1="1146" y1="728" x2="990" y2="638"/>
      <line x1="990" y1="638" x2="1094" y2="578"/>
      <line x1="1094" y1="578" x2="1094" y2="346"/>
      <line x1="1250" y1="668" x2="1250" y2="436"/>
      <line x1="1146" y1="728" x2="1146" y2="496"/>
      <line x1="990" y1="638" x2="990" y2="406"/>
      <line x1="1094" y1="346" x2="1250" y2="436"/>
      <line x1="1250" y1="436" x2="1146" y2="496"/>
      <line x1="1146" y1="496" x2="990" y2="406"/>
      <line x1="990" y1="406" x2="1094" y2="346"/>
    </g>

    <!-- collaborator cursors -->
    <g>
      <path d="M1262 410 Q1290 430 1300 470" stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.35"/>
      <path d="M1264 420 L1264 434 L1268 431 L1271 438 L1274 436.5 L1271 430 L1276 430 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="0.6"/>

      <path d="M978 660 Q950 630 966 590" stroke="#ef4444" stroke-width="1.2" fill="none" opacity="0.35"/>
      <path d="M968 648 L968 662 L972 659 L975 666 L978 664.5 L975 658 L980 658 Z" fill="#ef4444" stroke="#0f172a" stroke-width="0.6"/>

      <path d="M1106 610 Q1130 590 1120 550" stroke="#3b82f6" stroke-width="1.2" fill="none" opacity="0.35"/>
      <path d="M1100 596 L1100 610 L1104 607 L1107 614 L1110 612.5 L1107 606 L1112 606 Z" fill="#3b82f6" stroke="#0f172a" stroke-width="0.6"/>
    </g>
  </g>
</svg>
