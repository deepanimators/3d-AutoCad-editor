<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="g3" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="edgeGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowBlur3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#0f172a"/>
  <rect width="1080" height="1080" fill="url(#g3)"/>

  <g transform="translate(60,50) scale(0.9)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="92" y="68" font-size="16" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <text x="52" y="250" font-size="130" font-weight="800" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4">03</text>

  <!-- sun -->
  <g stroke="#93c5fd" stroke-width="1.6" fill="none" opacity="0.8">
    <circle cx="760" cy="420" r="20"/>
    <line x1="760" y1="388" x2="760" y2="374"/>
    <line x1="760" y1="452" x2="760" y2="466"/>
    <line x1="728" y1="420" x2="714" y2="420"/>
    <line x1="792" y1="420" x2="806" y2="420"/>
    <line x1="738" y1="398" x2="728" y2="388"/>
    <line x1="782" y1="442" x2="792" y2="452"/>
    <line x1="782" y1="398" x2="792" y2="388"/>
    <line x1="738" y1="442" x2="728" y2="452"/>
  </g>
  <line x1="745" y1="440" x2="650" y2="534" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3,5" opacity="0.4"/>
  <line x1="742" y1="443" x2="540" y2="470" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3,5" opacity="0.4"/>

  <!-- shadow -->
  <ellipse cx="470" cy="850" rx="150" ry="36" fill="#000000" opacity="0.4" filter="url(#shadowBlur3)"/>

  <!-- building -->
  <g filter="url(#edgeGlow3)" stroke="#60a5fa" stroke-width="2.4" fill="none" stroke-linecap="round">
    <line x1="540" y1="700" x2="650" y2="764"/>
    <line x1="650" y1="764" x2="595" y2="796"/>
    <line x1="595" y1="796" x2="485" y2="732"/>
    <line x1="485" y1="732" x2="540" y2="700"/>
    <line x1="540" y1="700" x2="540" y2="470"/>
    <line x1="650" y1="764" x2="650" y2="534"/>
    <line x1="595" y1="796" x2="595" y2="566"/>
    <line x1="485" y1="732" x2="485" y2="502"/>
    <line x1="540" y1="470" x2="650" y2="534"/>
    <line x1="650" y1="534" x2="595" y2="566"/>
    <line x1="595" y1="566" x2="485" y2="502"/>
    <line x1="485" y1="502" x2="540" y2="470"/>
  </g>

  <text x="60" y="924" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-1">See the shadows</text>
  <text x="60" y="968" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-1">before you build.</text>
  <text x="60" y="1000" font-size="17" fill="#94a3b8">Sun &amp; Shadow Study — solar path by GPS + time. Pro plan.</text>

  <text x="1020" y="1030" font-size="18" fill="#64748b" text-anchor="end">aruct.com</text>
</svg>
