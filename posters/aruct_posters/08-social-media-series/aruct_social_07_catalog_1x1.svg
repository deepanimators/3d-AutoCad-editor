  <text x="92" y="68" font-size="16" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <text x="52" y="250" font-size="130" font-weight="800" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4">07</text>

  <!-- model thumbnail grid -->
