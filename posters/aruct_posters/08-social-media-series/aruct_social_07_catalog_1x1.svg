    <g transform="translate(540,770)">
      <circle cx="0" cy="0" r="22"/>
      <ellipse cx="0" cy="0" rx="22" ry="8"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <path d="M0 -22 v44"/>
