  <text x="60" y="900" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">10,000+ free 3D models.</text>
  <text x="60" y="936" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">Built in.</text>
  <text x="60" y="972" font-size="19" fill="#94a3b8">Poly Haven + Poly Pizza. CC0 license. Drag to place.</text>

  <text x="1020" y="1030" font-size="18" fill="#64748b" text-anchor="end">aruct.com</text>
