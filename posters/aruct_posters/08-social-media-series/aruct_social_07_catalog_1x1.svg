      <rect x="470" y="380" width="140" height="140" rx="12" fill="#131c31"/>
      <rect x="630" y="380" width="140" height="140" rx="12" fill="#131c31"/>
      <rect x="310" y="540" width="140" height="140" rx="12" fill="#131c31"/>
      <rect x="470" y="540" width="140" height="140" rx="12" fill="#131c31"/>
      <rect x="630" y="540" width="140" height="140" rx="12" fill="#131c31"/>
      <rect x="310" y="700" width="140" height="140" rx="12" fill="#131c31"/>
      <rect x="470" y="700" width="140" height="140" rx="12" fill="#131c31"/>
      <rect x="630" y="700" width="140" height="140" rx="12" fill="#131c31"/>
