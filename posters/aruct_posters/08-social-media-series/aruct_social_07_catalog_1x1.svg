      <rect x="470" y="380" width="140" height="140" rx="12"/>
      <rect x="630" y="380" width="140" height="140" rx="12"/>
      <rect x="310" y="540" width="140" height="140" rx="12"/>
      <rect x="470" y="540" width="140" height="140" rx="12"/>
