    <!-- table -->
    <g transform="translate(700,450)">
      <line x1="-26" y1="-14" x2="26" y2="-14"/>
      <line x1="-26" y1="-14" x2="-26" y2="20"/>
      <line x1="26" y1="-14" x2="26" y2="20"/>
      <line x1="-18" y1="-14" x2="-18" y2="20"/>
