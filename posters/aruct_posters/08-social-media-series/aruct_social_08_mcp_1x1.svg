<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="g8" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <filter id="edgeGlow8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haloBlur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#05070d"/>
  <rect width="1080" height="1080" fill="url(#g8)"/>

  <g transform="translate(60,50) scale(0.9)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="92" y="68" font-size="16" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <text x="52" y="250" font-size="130" font-weight="800" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.4">08</text>

  <!-- chat prompt -->
  <g>
    <rect x="270" y="380" width="540" height="88" rx="10" fill="#0a0e14" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="302" cy="408" r="9" fill="none" stroke="#22d3ee" stroke-width="1.3"/>
    <text x="302" y="412" font-size="10" fill="#22d3ee" text-anchor="middle" font-weight="700">AI</text>
    <text x="326" y="414" font-size="15" fill="#e2e8f0" font-family="'SFMono-Regular','Menlo','Consolas',monospace">"add a glass-walled entrance"<tspan fill="#22d3ee">▍</tspan></text>
    <text x="326" y="440" font-size="13" fill="#64748b" font-family="'SFMono-Regular','Menlo','Consolas',monospace">— sent to your scene graph</text>
  </g>

  <text x="540" y="502" font-size="28" fill="#475569" text-anchor="middle">↓</text>

  <!-- existing building -->
  <g stroke="#475569" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85">
    <line x1="560" y1="740" x2="660" y2="798"/>
    <line x1="660" y1="798" x2="610" y2="827"/>
    <line x1="610" y1="827" x2="510" y2="769"/>
    <line x1="510" y1="769" x2="560" y2="740"/>
    <line x1="560" y1="740" x2="560" y2="530"/>
    <line x1="660" y1="798" x2="660" y2="588"/>
    <line x1="610" y1="827" x2="610" y2="617"/>
    <line x1="510" y1="769" x2="510" y2="559"/>
    <line x1="560" y1="530" x2="660" y2="588"/>
    <line x1="660" y1="588" x2="610" y2="617"/>
    <line x1="610" y1="617" x2="510" y2="559"/>
    <line x1="510" y1="559" x2="560" y2="530"/>
  </g>

  <line x1="470" y1="468" x2="440" y2="700" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,5" opacity="0.35"/>
  <circle cx="440" cy="712" r="50" fill="#22d3ee" opacity="0.22" filter="url(#haloBlur8)"/>

  <!-- new highlighted room (the "glass entrance") -->
  <g filter="url(#edgeGlow8)" stroke="#22d3ee" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="440" y1="748" x2="466" y2="763"/>
    <line x1="466" y1="763" x2="440" y2="778"/>
    <line x1="440" y1="778" x2="414" y2="763"/>
    <line x1="414" y1="763" x2="440" y2="748"/>
    <line x1="440" y1="748" x2="440" y2="648"/>
    <line x1="466" y1="763" x2="466" y2="663"/>
    <line x1="440" y1="778" x2="440" y2="678"/>
    <line x1="414" y1="763" x2="414" y2="663"/>
    <line x1="440" y1="648" x2="466" y2="663"/>
    <line x1="466" y1="663" x2="440" y2="678"/>
    <line x1="440" y1="678" x2="414" y2="663"/>
    <line x1="414" y1="663" x2="440" y2="648"/>
  </g>
  <!-- glass panes on the new element -->
  <g stroke="#67e8f9" stroke-width="1.2" opacity="0.6">
    <line x1="427" y1="656" x2="427" y2="756"/>
    <line x1="453" y1="656" x2="453" y2="756"/>
  </g>

  <text x="60" y="900" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">Describe it.</text>
  <text x="60" y="948" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">It builds.</text>
  <text x="60" y="982" font-size="19" fill="#94a3b8">MCP server — Claude and Cursor can write your scenes. Pro plan.</text>

  <text x="1020" y="1030" font-size="18" fill="#64748b" text-anchor="end">aruct.com</text>
</svg>
