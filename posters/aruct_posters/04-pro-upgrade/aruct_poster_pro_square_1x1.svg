  <g stroke="#475569" stroke-width="1.3" fill="none" stroke-linecap="round">
    <line x1="175" y1="470" x2="225" y2="498"/>
    <line x1="225" y1="498" x2="200" y2="512"/>
    <line x1="200" y1="512" x2="150" y2="484"/>
    <line x1="150" y1="484" x2="175" y2="470"/>
    <line x1="175" y1="470" x2="175" y2="368"/>
    <line x1="225" y1="498" x2="225" y2="396"/>
    <line x1="200" y1="512" x2="200" y2="410"/>
    <line x1="150" y1="484" x2="150" y2="382"/>
    <line x1="175" y1="368" x2="225" y2="396"/>
    <line x1="225" y1="396" x2="200" y2="410"/>
    <line x1="200" y1="410" x2="150" y2="382"/>
    <line x1="150" y1="382" x2="175" y2="368"/>
  </g>

  <text x="310" y="450" font-size="42" fill="#475569" text-anchor="middle">→</text>

  <text x="380" y="368" font-size="16" font-weight="700" fill="#93c5fd" letter-spacing="2">PRO</text>
  <g stroke="#93c5fd" stroke-width="1.2" fill="none" opacity="0.75">
    <circle cx="640" cy="360" r="12"/>
    <line x1="640" y1="340" x2="640" y2="331"/>
    <line x1="640" y1="380" x2="640" y2="389"/>
    <line x1="620" y1="360" x2="611" y2="360"/>
    <line x1="660" y1="360" x2="669" y2="360"/>
  </g>
  <ellipse cx="470" cy="586" rx="88" ry="26" fill="#000000" opacity="0.4" filter="url(#shadowBlur4sq)"/>
  <g filter="url(#edgeGlow4sq)" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="480" y1="500" x2="560" y2="540"/>
    <line x1="560" y1="540" x2="524" y2="560"/>
    <line x1="524" y1="560" x2="444" y2="520"/>
    <line x1="444" y1="520" x2="480" y2="500"/>
    <line x1="480" y1="500" x2="480" y2="360"/>
    <line x1="560" y1="540" x2="560" y2="400"/>
    <line x1="524" y1="560" x2="524" y2="420"/>
    <line x1="444" y1="520" x2="444" y2="380"/>
    <line x1="480" y1="360" x2="560" y2="400"/>
    <line x1="560" y1="400" x2="524" y2="420"/>
    <line x1="524" y1="420" x2="444" y2="380"/>
    <line x1="444" y1="380" x2="480" y2="360"/>
