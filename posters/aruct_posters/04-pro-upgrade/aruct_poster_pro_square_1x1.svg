<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="glow4sq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="edgeGlow4sq" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowBlur4sq" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#0f172a"/>
  <rect width="1200" height="320" fill="url(#glow4sq)"/>

  <!-- logo -->
  <g transform="translate(60,52) scale(1.0)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="96" y="71" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- eyebrow -->
  <text x="60" y="130" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="3">READY TO GO FURTHER?</text>

  <!-- giant price -->
  <text x="56" y="272" font-size="128" font-weight="700" fill="#3b82f6" letter-spacing="-2.5">$29<tspan font-size="34" font-weight="500" fill="#94a3b8">/month</tspan></text>

  <!-- trial emphasis -->
  <text x="60" y="312" font-size="19" font-weight="600" fill="#22c55e">14-day free trial · No credit card required</text>

  <!-- before/after row -->
