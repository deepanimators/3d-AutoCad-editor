    <text x="60" y="694"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Unlimited scenes <tspan fill="#64748b">(Free caps at 5)</tspan></text>
    <text x="60" y="732"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  GLB export — any 3D pipeline</text>
    <text x="60" y="770"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  MCP server — Claude &amp; Cursor write scenes</text>
    <text x="60" y="808"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Sun &amp; Shadow Study — solar analysis</text>
    <text x="60" y="846"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Bill of Materials — auto CSV/PDF export</text>
    <text x="60" y="884"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  AI Model Generator — text-to-3D</text>
  </g>

  <!-- CTA -->
  <rect x="60" y="950" width="420" height="58" rx="8" fill="#3b82f6"/>
  <text x="270" y="986" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Start your free trial</text>
  <text x="60" y="1040" font-size="15" fill="#64748b">aruct.com/pricing</text>
