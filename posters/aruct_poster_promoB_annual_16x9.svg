<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="warmGlowB" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileGlowB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>
  <rect width="1600" height="900" fill="url(#warmGlowB)"/>

  <!-- logo -->
  <g transform="translate(80,60) scale(1.1)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="120" y="81" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- badge -->
  <rect x="1290" y="56" width="230" height="36" rx="18" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="1405" y="79" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1" text-anchor="middle">SAVE 17% ANNUALLY</text>

  <!-- headline -->
  <text x="78" y="198" font-size="50" font-weight="700" fill="#ffffff" letter-spacing="-1">Pay less. Design more.</text>
  <text x="78" y="252" font-size="34" font-weight="700" fill="#94a3b8" letter-spacing="-0.5">2 months free on annual Pro.</text>

  <text x="80" y="292" font-size="17" fill="#94a3b8">Switch to annual billing and get 2 months free.</text>
  <text x="80" y="316" font-size="17" fill="#94a3b8">Cancel anytime. Scenes stay yours.</text>

  <!-- comparison cards -->
  <rect x="80" y="350" width="300" height="150" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="100" y="378" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="2">PRO</text>
  <text x="100" y="406" font-size="17" fill="#64748b">$29/month</text>
  <line x1="100" y1="399" x2="176" y2="399" stroke="#64748b" stroke-width="1.2"/>
  <text x="100" y="440" font-size="25" font-weight="700" fill="#3b82f6">$290<tspan font-size="14" font-weight="500" fill="#94a3b8">/year</tspan></text>
  <text x="100" y="468" font-size="13" font-weight="700" fill="#22c55e">Save $58</text>

  <rect x="400" y="350" width="300" height="150" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="420" y="378" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="2">TEAM</text>
  <text x="420" y="406" font-size="17" fill="#64748b">$79/seat/month</text>
  <line x1="420" y1="399" x2="530" y2="399" stroke="#64748b" stroke-width="1.2"/>
  <text x="420" y="440" font-size="22" font-weight="700" fill="#3b82f6">$790<tspan font-size="13" font-weight="500" fill="#94a3b8">/seat/yr</tspan></text>
  <text x="420" y="468" font-size="13" font-weight="700" fill="#22c55e">Save $158/seat</text>

  <text x="80" y="546" font-size="16" font-weight="600" fill="#22c55e">Cancel anytime · No credit card required to start a trial</text>

  <rect x="80" y="578" width="300" height="54" rx="8" fill="#3b82f6"/>
  <text x="230" y="612" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Save 17%</text>
  <text x="80" y="658" font-size="15" fill="#64748b">aruct.com/pricing</text>

  <!-- 12-month free-months visual -->
  <text x="1184" y="308" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5" text-anchor="middle">12 MONTHS OF ANNUAL PRO</text>
  <g>
    <!-- row1 -->
    <rect x="1000" y="330" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <rect x="1096" y="330" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <rect x="1192" y="330" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <rect x="1288" y="330" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <!-- row2 -->
    <rect x="1000" y="426" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <rect x="1096" y="426" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <rect x="1192" y="426" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <rect x="1288" y="426" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <!-- row3: last 2 highlighted free -->
    <rect x="1000" y="522" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <rect x="1096" y="522" width="80" height="80" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.1)"/>
    <rect x="1192" y="522" width="80" height="80" rx="10" fill="#3b82f6" filter="url(#tileGlowB)"/>
    <text x="1232" y="570" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">FREE</text>
    <rect x="1288" y="522" width="80" height="80" rx="10" fill="#3b82f6" filter="url(#tileGlowB)"/>
    <text x="1328" y="570" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">FREE</text>
  </g>
  <text x="1184" y="646" font-size="28" font-weight="700" fill="#3b82f6" text-anchor="middle">= 2 months free</text>
</svg>
