<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="g1" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="#0f172a"/>
  <rect width="1080" height="1080" fill="url(#g1)"/>

  <!-- logo -->
  <g transform="translate(60,50) scale(0.9)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="92" y="68" font-size="16" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- series number -->
  <text x="52" y="250" font-size="130" font-weight="800" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4">01</text>

  <!-- hero visual: browser bar -->
  <g>
    <rect x="140" y="440" width="800" height="200" rx="16" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="184" cy="490" r="7" fill="#ef4444"/>
    <circle cx="208" cy="490" r="7" fill="#f59e0b"/>
    <circle cx="232" cy="490" r="7" fill="#22c55e"/>
    <rect x="180" y="530" width="700" height="70" rx="35" fill="#0c1526" stroke="#3b82f6" stroke-width="1.6"/>
    <g stroke="#94a3b8" stroke-width="1.6" fill="none">
      <path d="M222 565 a11 11 0 1 1 0.01 0 M230 573 l8 8" stroke-linecap="round"/>
    </g>
    <text x="256" y="574" font-size="30" fill="#e2e8f0" font-family="'SFMono-Regular','Menlo','Consolas',monospace">aruct.com</text>
  </g>

  <!-- headline -->
  <text x="60" y="850" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">No install required.</text>
  <text x="60" y="900" font-size="21" fill="#94a3b8">Open a browser. Start designing.</text>

  <text x="1020" y="1030" font-size="18" fill="#64748b" text-anchor="end">aruct.com</text>
</svg>
