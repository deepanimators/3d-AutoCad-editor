<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="proGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#0f172a"/>
  <rect width="1600" height="320" fill="url(#topGlow)"/>

  <!-- logo -->
  <g transform="translate(80,54) scale(1.1)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="120" y="75" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- headline -->
  <text x="800" y="90" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">Simple, transparent pricing.</text>
  <text x="800" y="126" font-size="21" fill="#94a3b8" text-anchor="middle">Start free. Upgrade when you're ready.</text>

  <!-- PRO glow halo -->
  <rect x="572" y="187" width="456" height="621" rx="24" fill="#3b82f6" opacity="0.22" filter="url(#proGlow)"/>

  <!-- FREE card -->
  <g>
    <rect x="100" y="220" width="440" height="580" rx="16" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="132" y="270" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="3">FREE</text>
    <text x="132" y="344" font-size="56" font-weight="700" fill="#ffffff">$0</text>
    <text x="132" y="374" font-size="14" fill="#64748b">forever</text>
    <line x1="132" y1="402" x2="508" y2="402" stroke="rgba(255,255,255,0.08)"/>
    <g font-size="15" font-family="'SFMono-Regular','Menlo','Consolas',monospace" fill="#cbd5e1">
      <text x="132" y="444"><tspan fill="#3b82f6">✓</tspan>  Up to 5 scenes</text>
      <text x="132" y="486"><tspan fill="#3b82f6">✓</tspan>  JSON export</text>
      <text x="132" y="528"><tspan fill="#3b82f6">✓</tspan>  Basic 3D editor</text>
      <text x="132" y="570"><tspan fill="#3b82f6">✓</tspan>  Community support</text>
    </g>
    <rect x="132" y="724" width="376" height="44" rx="8" fill="none" stroke="#475569" stroke-width="1.2"/>
    <text x="320" y="751" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Get started</text>
  </g>

  <!-- PRO card -->
  <g>
    <rect x="580" y="195" width="440" height="605" rx="16" fill="#131c31" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="612" y="221" width="140" height="26" rx="13" fill="#3b82f6"/>
    <text x="682" y="238" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">MOST POPULAR</text>
    <text x="612" y="296" font-size="15" font-weight="700" fill="#93c5fd" letter-spacing="3">PRO</text>
    <text x="612" y="370" font-size="56" font-weight="700" fill="#ffffff">$29<tspan font-size="20" font-weight="500" fill="#94a3b8">/mo</tspan></text>
    <text x="612" y="400" font-size="14" fill="#64748b">14-day trial</text>
    <line x1="612" y1="428" x2="988" y2="428" stroke="rgba(255,255,255,0.08)"/>
    <g font-size="15" font-family="'SFMono-Regular','Menlo','Consolas',monospace" fill="#e2e8f0">
      <text x="612" y="470"><tspan fill="#3b82f6">✓</tspan>  Unlimited scenes</text>
      <text x="612" y="512"><tspan fill="#3b82f6">✓</tspan>  GLB + JSON export</text>
      <text x="612" y="554"><tspan fill="#3b82f6">✓</tspan>  MCP server (AI)</text>
      <text x="612" y="596"><tspan fill="#3b82f6">✓</tspan>  Priority support</text>
    </g>
    <rect x="612" y="749" width="376" height="44" rx="8" fill="#3b82f6"/>
    <text x="800" y="776" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Start trial</text>
  </g>

  <!-- TEAM card -->
  <g>
    <rect x="1060" y="220" width="440" height="580" rx="16" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="1092" y="270" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="3">TEAM</text>
    <text x="1092" y="344" font-size="56" font-weight="700" fill="#ffffff">$79<tspan font-size="18" font-weight="500" fill="#94a3b8">/seat/mo</tspan></text>
    <text x="1092" y="374" font-size="14" fill="#64748b">14-day trial</text>
    <line x1="1092" y1="402" x2="1468" y2="402" stroke="rgba(255,255,255,0.08)"/>
    <g font-size="15" font-family="'SFMono-Regular','Menlo','Consolas',monospace" fill="#cbd5e1">
      <text x="1092" y="438"><tspan fill="#3b82f6">✓</tspan>  Everything in Pro</text>
      <text x="1092" y="474"><tspan fill="#3b82f6">✓</tspan>  IFC / BIM export</text>
      <text x="1092" y="510"><tspan fill="#3b82f6">✓</tspan>  Real-time collab</text>
      <text x="1092" y="546"><tspan fill="#3b82f6">✓</tspan>  SSO / SAML</text>
      <text x="1092" y="582"><tspan fill="#3b82f6">✓</tspan>  Audit log</text>
    </g>
    <rect x="1092" y="724" width="376" height="44" rx="8" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <text x="1280" y="751" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Start trial</text>
  </g>

  <!-- footer -->
  <text x="800" y="858" font-size="16" fill="#64748b" text-anchor="middle">14-day free trial · No credit card required</text>
</svg>
