<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="glow6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <filter id="edgeGlow6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haloBlur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#05070d"/>
  <rect width="1600" height="320" fill="url(#glow6)"/>

  <!-- logo -->
  <g transform="translate(80,60) scale(1.1)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="120" y="81" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- eyebrow -->
  <text x="80" y="126" font-size="14" font-weight="700" fill="#22d3ee" letter-spacing="2.5" font-family="'SFMono-Regular','Menlo','Consolas',monospace">MCP / AI INTEGRATION</text>

  <!-- headline -->
  <text x="78" y="192" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1">Describe a building.</text>
  <text x="78" y="254" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1">Watch it appear.</text>

  <!-- sub-headline -->
  <text x="80" y="292" font-size="18" fill="#94a3b8">Aruct is the only architectural editor with MCP support.</text>
  <text x="80" y="318" font-size="18" fill="#94a3b8">Connect Claude, Cursor, or any MCP client and let AI</text>
  <text x="80" y="344" font-size="18" fill="#94a3b8">manipulate your 3D scene directly.</text>

  <!-- terminal block -->
  <g>
    <rect x="80" y="380" width="620" height="112" rx="10" fill="#000000" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M80 390 a10 10 0 0 1 10 -10 h600 a10 10 0 0 1 10 10 v18 h-620 z" fill="#0d1117"/>
    <circle cx="102" cy="399" r="4.5" fill="#ef4444"/>
    <circle cx="118" cy="399" r="4.5" fill="#f59e0b"/>
    <circle cx="134" cy="399" r="4.5" fill="#22c55e"/>
    <text x="106" y="438" font-size="17" fill="#4ade80" font-family="'SFMono-Regular','Menlo','Consolas',monospace">$ npx @aruct/mcp</text>
    <text x="106" y="466" font-size="14" fill="#22d3ee" font-family="'SFMono-Regular','Menlo','Consolas',monospace">→ Claude now has access to your scene graph.</text>
  </g>

  <!-- CTA -->
  <text x="80" y="536" font-size="17" fill="#cbd5e1">Available on Pro — <tspan fill="#22d3ee" font-weight="700">$29/month</tspan> <tspan fill="#64748b">· aruct.com</tspan></text>

  <!-- chat prompt panel -->
  <g>
    <rect x="780" y="200" width="560" height="92" rx="10" fill="#0a0e14" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="812" cy="228" r="9" fill="none" stroke="#22d3ee" stroke-width="1.3"/>
    <text x="812" y="232" font-size="10" fill="#22d3ee" text-anchor="middle" font-weight="700">AI</text>
    <text x="836" y="234" font-size="15" fill="#e2e8f0" font-family="'SFMono-Regular','Menlo','Consolas',monospace">"add a bedroom with two windows</text>
    <text x="836" y="260" font-size="15" fill="#e2e8f0" font-family="'SFMono-Regular','Menlo','Consolas',monospace">facing north"<tspan fill="#22d3ee">▍</tspan></text>
  </g>

  <text x="1060" y="326" font-size="30" fill="#475569" text-anchor="middle">↓</text>

  <!-- 3D scene panel -->
  <g>
    <rect x="780" y="340" width="560" height="440" rx="12" fill="#05070d" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M780 352 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v18 h-560 z" fill="#0a0e14"/>
    <circle cx="806" cy="358" r="4.2" fill="#ef4444"/>
    <circle cx="822" cy="358" r="4.2" fill="#f59e0b"/>
    <circle cx="838" cy="358" r="4.2" fill="#22c55e"/>
    <text x="1320" y="362" font-size="11" fill="#64748b" text-anchor="end">scene.json</text>

    <!-- existing building (dimmer) -->
    <g stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
      <line x1="1060" y1="690" x2="1160" y2="748"/>
      <line x1="1160" y1="748" x2="1110" y2="777"/>
      <line x1="1110" y1="777" x2="1010" y2="719"/>
      <line x1="1010" y1="719" x2="1060" y2="690"/>
      <line x1="1060" y1="690" x2="1060" y2="470"/>
      <line x1="1160" y1="748" x2="1160" y2="528"/>
      <line x1="1110" y1="777" x2="1110" y2="557"/>
      <line x1="1010" y1="719" x2="1010" y2="499"/>
      <line x1="1060" y1="470" x2="1160" y2="528"/>
      <line x1="1160" y1="528" x2="1110" y2="557"/>
      <line x1="1110" y1="557" x2="1010" y2="499"/>
      <line x1="1010" y1="499" x2="1060" y2="470"/>
    </g>

    <!-- connecting line from prompt to new element -->
    <line x1="1000" y1="292" x2="950" y2="610" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,5" opacity="0.35"/>

    <!-- new element halo -->
    <circle cx="950" cy="620" r="55" fill="#22d3ee" opacity="0.22" filter="url(#haloBlur6)"/>

    <!-- new highlighted room -->
    <g filter="url(#edgeGlow6)" stroke="#22d3ee" stroke-width="2.4" fill="none" stroke-linecap="round">
      <line x1="950" y1="660" x2="978" y2="676"/>
      <line x1="978" y1="676" x2="950" y2="692"/>
      <line x1="950" y1="692" x2="922" y2="676"/>
      <line x1="922" y1="676" x2="950" y2="660"/>
      <line x1="950" y1="660" x2="950" y2="550"/>
      <line x1="978" y1="676" x2="978" y2="566"/>
      <line x1="950" y1="692" x2="950" y2="582"/>
      <line x1="922" y1="676" x2="922" y2="566"/>
      <line x1="950" y1="550" x2="978" y2="566"/>
      <line x1="978" y1="566" x2="950" y2="582"/>
      <line x1="950" y1="582" x2="922" y2="566"/>
      <line x1="922" y1="566" x2="950" y2="550"/>
    </g>
    <g stroke="#67e8f9" stroke-width="1.8">
      <line x1="936" y1="556" x2="936" y2="568"/>
      <line x1="964" y1="556" x2="964" y2="568"/>
    </g>
  </g>
</svg>
