      <line x1="793" y1="874" x2="661" y2="950"/>
      <line x1="661" y1="950" x2="463" y2="836"/>
      <line x1="463" y1="836" x2="595" y2="760"/>
      <line x1="595" y1="760" x2="595" y2="460"/>
      <line x1="793" y1="874" x2="793" y2="574"/>
      <line x1="661" y1="950" x2="661" y2="650"/>
      <line x1="463" y1="836" x2="463" y2="536"/>
