  <text x="60" y="1372" font-size="20" font-weight="600" fill="#ffffff">$79/seat/month <tspan fill="#64748b" font-weight="400">·</tspan> <tspan fill="#22c55e">14-day free trial</tspan> <tspan fill="#64748b" font-weight="400">· No card required</tspan></text>

