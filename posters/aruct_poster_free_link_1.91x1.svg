<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="glowLp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="628" fill="#0f172a"/>
  <rect width="1200" height="628" fill="url(#glowLp)"/>

  <!-- logo -->
  <g transform="translate(56,44) scale(0.95)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="90" y="62" font-size="17" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- headline (left column) -->
  <text x="56" y="200" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1">Free. <tspan fill="#3b82f6">Forever.</tspan></text>
  <text x="58" y="238" font-size="22" font-weight="600" fill="#cbd5e1">No credit card. No expiry.</text>
  <text x="58" y="270" font-size="16" fill="#94a3b8">The full 3D architectural editor — free,</text>
  <text x="58" y="292" font-size="16" fill="#94a3b8">right in your browser.</text>

  <g font-size="15" fill="#e2e8f0">
    <text x="58" y="336"><tspan fill="#22c55e" font-weight="700">✓</tspan>  Up to 5 scenes  <tspan fill="#22c55e" font-weight="700">✓</tspan>  JSON export</text>
    <text x="58" y="366"><tspan fill="#22c55e" font-weight="700">✓</tspan>  Basic 3D editor  <tspan fill="#22c55e" font-weight="700">✓</tspan>  Community support</text>
  </g>

  <rect x="58" y="410" width="290" height="50" rx="8" fill="#3b82f6"/>
  <text x="203" y="442" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Get started free</text>
  <text x="58" y="494" font-size="14" fill="#64748b">aruct.com · No install required</text>

  <!-- browser mockup (right column) -->
  <g>
    <rect x="660" y="90" width="500" height="448" rx="12" fill="#0c1526" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
