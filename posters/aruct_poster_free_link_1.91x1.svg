    <line x1="660" y1="122" x2="1160" y2="122" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="682" cy="112" r="4.5" fill="#ef4444"/>
    <circle cx="698" cy="112" r="4.5" fill="#f59e0b"/>
    <circle cx="714" cy="112" r="4.5" fill="#22c55e"/>
    <text x="910" y="116" font-size="11" fill="#64748b" text-anchor="middle">aruct.com/editor</text>

