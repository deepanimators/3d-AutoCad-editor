      <line x1="1000" y1="190" x2="1090" y2="190"/>
      <line x1="1090" y1="190" x2="1090" y2="480"/>
      <line x1="1090" y1="480" x2="730" y2="480"/>
      <line x1="730" y1="480" x2="730" y2="190"/>
