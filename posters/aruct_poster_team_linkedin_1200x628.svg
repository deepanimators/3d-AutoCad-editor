<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="glowLi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="edgeGlowLi" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="628" fill="#0f172a"/>
  <rect width="1200" height="240" fill="url(#glowLi)"/>

  <!-- logo -->
  <g transform="translate(56,42) scale(0.95)" stroke="#ffffff" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 L22 7.5 L12 13 L2 7.5 Z"/>
    <line x1="2" y1="13" x2="22" y2="13"/>
    <path d="M2 7.5 L2 16.5 L12 22 L12 13"/>
    <path d="M22 7.5 L22 16.5 L12 22"/>
  </g>
  <text x="90" y="60" font-size="16" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Aruct</text>

  <!-- headline -->
  <text x="56" y="128" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Your whole firm.</text>
  <text x="56" y="168" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="-0.5">One shared scene.</text>

  <!-- ROI comparison -->
  <rect x="56" y="196" width="440" height="88" rx="9" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="74" y="219" font-size="11" fill="#94a3b8">TYPICAL BIM SEAT LICENSE</text>
  <text x="74" y="246" font-size="19" fill="#64748b">$3,000–$7,000/yr</text>
  <line x1="74" y1="238" x2="230" y2="238" stroke="#64748b" stroke-width="1.2"/>
  <line x1="266" y1="208" x2="266" y2="270" stroke="rgba(255,255,255,0.08)"/>
  <text x="284" y="219" font-size="11" fill="#93c5fd">ARUCT TEAM</text>
  <text x="284" y="252" font-size="23" font-weight="700" fill="#3b82f6">$948<tspan font-size="11" font-weight="500" fill="#94a3b8">/yr/seat</tspan></text>
  <text x="74" y="274" font-size="12" font-weight="700" fill="#22c55e">Save 80–90% per designer</text>

  <!-- features (compact 2-col) -->
  <g font-size="13.5" fill="#e2e8f0">
    <text x="56" y="312"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Everything in Pro</text>
    <text x="56" y="336"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Real-time collaboration</text>
    <text x="56" y="360"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  IFC / BIM export</text>
    <text x="290" y="312"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  SSO / SAML</text>
    <text x="290" y="336"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Audit log</text>
    <text x="290" y="360"><tspan fill="#3b82f6" font-weight="700">✓</tspan>  Priority support</text>
  </g>

  <text x="56" y="398" font-size="14" font-weight="600" fill="#ffffff">$79/seat/mo <tspan fill="#22c55e">· 14-day trial</tspan> <tspan fill="#64748b" font-weight="400">· no card</tspan></text>

  <rect x="56" y="422" width="260" height="46" rx="8" fill="#3b82f6"/>
  <text x="186" y="451" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Bring your team</text>
  <text x="56" y="500" font-size="13" fill="#64748b">aruct.com/pricing</text>

  <!-- shared-scene window -->
  <g>
    <rect x="580" y="70" width="564" height="488" rx="12" fill="#0c1526" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M580 82 a12 12 0 0 1 12 -12 h540 a12 12 0 0 1 12 12 v22 h-564 z" fill="#111c33"/>
    <line x1="580" y1="104" x2="1144" y2="104" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="602" cy="93" r="4.5" fill="#ef4444"/>
    <circle cx="618" cy="93" r="4.5" fill="#f59e0b"/>
    <circle cx="634" cy="93" r="4.5" fill="#22c55e"/>
    <text x="656" y="97" font-size="11" fill="#64748b">aruct.com/scene/lakeside-tower</text>
    <text x="1090" y="97" font-size="10" fill="#64748b" text-anchor="end">3 online</text>
    <circle cx="1118" cy="93" r="7.5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
    <circle cx="1132" cy="93" r="7.5" fill="#0f172a" stroke="#ef4444" stroke-width="1.4"/>
    <circle cx="1146" cy="93" r="7.5" fill="#0f172a" stroke="#3b82f6" stroke-width="1.4"/>

    <g filter="url(#edgeGlowLi)" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="862" y1="360" x2="990" y2="432"/>
      <line x1="990" y1="432" x2="906" y2="480"/>
      <line x1="906" y1="480" x2="778" y2="408"/>
      <line x1="778" y1="408" x2="862" y2="360"/>
      <line x1="862" y1="360" x2="862" y2="168"/>
      <line x1="990" y1="432" x2="990" y2="240"/>
      <line x1="906" y1="480" x2="906" y2="288"/>
      <line x1="778" y1="408" x2="778" y2="216"/>
      <line x1="862" y1="168" x2="990" y2="240"/>
      <line x1="990" y1="240" x2="906" y2="288"/>
      <line x1="906" y1="288" x2="778" y2="216"/>
      <line x1="778" y1="216" x2="862" y2="168"/>
    </g>

    <g>
      <path d="M998 200 L998 213 L1002 210 L1005 217 L1008 215.5 L1005 209 L1010 209 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="0.6"/>
      <path d="M770 400 L770 413 L774 410 L777 417 L780 415.5 L777 409 L782 409 Z" fill="#ef4444" stroke="#0f172a" stroke-width="0.6"/>
      <path d="M870 350 L870 363 L874 360 L877 367 L880 365.5 L877 359 L882 359 Z" fill="#3b82f6" stroke="#0f172a" stroke-width="0.6"/>
    </g>
  </g>
</svg>
